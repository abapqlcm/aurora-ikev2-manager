# Example Aurora conn block (no secrets).
# Placed between markers in /etc/ipsec.conf by install.sh.

# aurora-begin aurora-ikev2
conn %default
    keyexchange=ikev2
    dpdaction=clear
    dpddelay=300s

conn aurora-ikev2
    left=%any
    leftid=@YOUR_SERVER_PUBLIC_IP
    leftsubnet=0.0.0.0/0
    leftauth=pubkey
    leftcert=server-cert.pem
    right=%any
    rightsourceip=10.99.0.0/24
    rightauth=eap-mschapv2
    eap_identity=%any
    dns=1.1.1.1,1.0.0.1
    auto=add
# aurora-end aurora-ikev2
