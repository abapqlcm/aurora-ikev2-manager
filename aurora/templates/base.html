<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Aurora IKEv2{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
{% if session.get('uid') %}
<nav>
  <a href="{{ url_for('dashboard') }}" class="{{ 'active' if request.path == '/' }}">Dashboard</a>
  <a href="{{ url_for('users') }}" class="{{ 'active' if request.path == '/users' }}">Users</a>
  <a href="{{ url_for('connections') }}" class="{{ 'active' if request.path == '/connections' }}">Connections</a>
  <a href="{{ url_for('server') }}" class="{{ 'active' if request.path == '/server' }}">Server</a>
  <a href="{{ url_for('client_setup') }}" class="{{ 'active' if request.path == '/setup' }}">Client</a>
  <form method="post" action="{{ url_for('logout') }}" class="inline">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <button class="link">Logout</button>
  </form>
</nav>
{% endif %}
<main>
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer>Aurora IKEv2 Manager</footer>
</body>
</html>
